version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Manila
    open-pull-requests-limit: 2
    groups:
      action-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'ci(deps)'
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:30'
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    groups:
      python-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'build(deps)'
