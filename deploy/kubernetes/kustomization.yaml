apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticketpilot-demo
resources:
- namespace.yaml
- app-state.yaml
- app.yaml
- prometheus.yaml
- grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: ticketpilot
    ticketpilot.local/purpose: portfolio-demo
configMapGenerator:
- name: prometheus-config
  files:
  - prometheus.yml=config/prometheus.yml
  - alerts.yml=config/alerts.yml
- name: grafana-datasource
  files:
  - prometheus.yml=config/grafana-datasource.yml
- name: grafana-dashboard-provider
  files:
  - default.yml=config/grafana-provider.yml
- name: grafana-dashboards
  files:
  - apartments.json=config/apartments.json
  - ticketpilot.json=config/ticketpilot.json
