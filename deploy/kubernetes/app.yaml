apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/part-of: ticketpilot
    ticketpilot.local/purpose: portfolio-demo
    app.kubernetes.io/name: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ticketpilot
        ticketpilot.local/purpose: portfolio-demo
        app.kubernetes.io/name: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ticketpilot-k8s:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: state
          mountPath: /app/state
        - name: tmp
          mountPath: /tmp
        env:
        - name: STORAGE_MODE
          value: sqlite
        - name: SQLITE_PATH
          value: /app/state/operations.db
        - name: LLM_PROVIDER
          value: none
        - name: APARTMENT_NAME
          value: TicketPilot Kubernetes Demo
        - name: APARTMENT_UNITS
          value: 1,2,3,4,5,6,7,8
        - name: APARTMENT_REFRESH_SECONDS
          value: '0'
        - name: APARTMENT_QUEUE_LIMIT
          value: '20'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: ticketpilot-demo-auth
              key: ADMIN_TOKEN
        - name: METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ticketpilot-demo-auth
              key: METRICS_TOKEN
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: app-state
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/part-of: ticketpilot
    ticketpilot.local/purpose: portfolio-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app
  ports:
  - name: http
    port: 8080
    targetPort: http
