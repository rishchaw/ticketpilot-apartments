apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: ticketpilot
    ticketpilot.local/purpose: portfolio-demo
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ticketpilot
        ticketpilot.local/purpose: portfolio-demo
        app.kubernetes.io/name: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.14.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: auth
          mountPath: /run/secrets
          readOnly: true
        - name: data
          mountPath: /prometheus
        - name: tmp
          mountPath: /tmp
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2d
        - --storage.tsdb.retention.size=128MB
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: auth
        secret:
          secretName: ticketpilot-demo-auth
          items:
          - key: metrics-token
            path: metrics-token
      - name: data
        emptyDir:
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: ticketpilot
    ticketpilot.local/purpose: portfolio-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
